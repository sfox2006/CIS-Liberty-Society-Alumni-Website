     Paste this whole snippet into a WordPress Custom HTML block or Elementor HTML widget. -->
<iframe
  id="cis-liberty-timeline"
  title="Liberty &amp; Society anniversary timeline"
  src="https://sfox2006.github.io/CIS-Liberty-Society-Alumni-Website/?layout=horizontal"
  style="display:block;width:100%;height:1000px;border:0;"
  loading="lazy"></iframe>
<script>
(() => {
  const frame = document.getElementById('cis-liberty-timeline');
  const origin = new URL(frame.src).origin;
  function initialise() {
    frame.contentWindow.postMessage({ type: 'cis-liberty-init' }, origin);
    viewport();
  }
  function viewport() {
    const rect = frame.getBoundingClientRect();
    frame.contentWindow.postMessage({ type: 'cis-liberty-viewport', top: Math.max(0, -rect.top), height: window.innerHeight }, origin);
  }
  window.addEventListener('message', event => {
    if (event.origin !== origin || event.source !== frame.contentWindow) return;
    if (event.data?.type !== 'cis-liberty-height') return;
    const height = event.data.height;
    if (typeof height !== 'number' || !Number.isFinite(height) || height < 100 || height > 100000) return;
    frame.style.height = Math.ceil(height) + 'px';
  });
  frame.addEventListener('load', initialise);
  window.addEventListener('scroll', viewport, { passive: true });
  window.addEventListener('resize', viewport);
  initialise();
})();
</script>
